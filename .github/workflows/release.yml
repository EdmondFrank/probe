name: Build and Release Probe Binary

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v1.1.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: false
        type: string

permissions:
  contents: write # Required to upload release assets
  id-token: write # Required for npm OIDC authentication

jobs:
  build-and-release:
    name: Build and Release for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            archive_ext: "zip"
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Rust toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # Setup Rust cache
      - name: Setup Rust cache
        uses: actions/cache@v4
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml') || 'stable' }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Configure APT sources for arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo bash -c 'cat > /etc/apt/sources.list << EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF'

      - name: Setup cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config libssl-dev:arm64 libc6-dev-arm64-cross
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu"
            echo "OPENSSL_INCLUDE_DIR=/usr/include"
          } >> "$GITHUB_ENV"

      # Build the Rust project
      - name: Build Release
        timeout-minutes: 45
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            # For Windows, use static linking of the C++ runtime
            mkdir -p .cargo
            echo '[target.x86_64-pc-windows-msvc]' > .cargo/config.toml
            echo 'rustflags = ["-C", "target-feature=+crt-static", "-C", "link-args=/DEBUG:NONE", "-C", "link-args=/NOLOGO"]' >> .cargo/config.toml
            cargo build --release --target ${{ matrix.target }}
          else
            # For other platforms, use the default build
            cargo build --release --target ${{ matrix.target }}
          fi

      # Package the binary into an archive
      - name: Package Binary
        shell: bash
        run: |
          BINARY_NAME="probe"
          # Determine version from tag or workflow_dispatch input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          ARCHIVE_NAME="$BINARY_NAME-${VERSION}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_NAME"

          # Copy binary
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.binary_ext }}" "$ARCHIVE_NAME/"

          # Copy documentation and license files
          cp README.md "${ARCHIVE_NAME}/" || true
          cp LICENSE "${ARCHIVE_NAME}/" || true

          # Create archive
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            echo "ASSET=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          elif [ "${{ matrix.archive_ext }}" = "zip" ]; then
            # Use PowerShell's built-in Compress-Archive (Windows native, no third-party tools needed)
            powershell -Command "Compress-Archive -Path '${ARCHIVE_NAME}' -DestinationPath '${ARCHIVE_NAME}.zip'"
            echo "ASSET=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          fi

          # Generate SHA256 checksum
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile "${ARCHIVE_NAME}.${{ matrix.archive_ext }}" SHA256 | grep -v "^SHA256" | grep -v "^CertUtil" > "${ARCHIVE_NAME}.${{ matrix.archive_ext }}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.${{ matrix.archive_ext }}" > "${ARCHIVE_NAME}.${{ matrix.archive_ext }}.sha256"
          fi
          echo "CHECKSUM=${ARCHIVE_NAME}.${{ matrix.archive_ext }}.sha256" >> "$GITHUB_ENV"

      # Upload artifact for npm packaging and release
      - name: Upload artifact for npm packaging
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET }}
          retention-days: 1

      # Upload checksum for release
      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.target }}
          path: ${{ env.CHECKSUM }}
          retention-days: 1

  # Publish per-target npm packages
  publish-target-packages:
    name: Publish ${{ matrix.target }} to npm
    needs: build-and-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            node_os: linux
            node_cpu: x64
            archive_ext: tar.gz
            binary_ext: ""
          - target: aarch64-unknown-linux-gnu
            node_os: linux
            node_cpu: arm64
            archive_ext: tar.gz
            binary_ext: ""
          - target: x86_64-apple-darwin
            node_os: darwin
            node_cpu: x64
            archive_ext: tar.gz
            binary_ext: ""
          - target: aarch64-apple-darwin
            node_os: darwin
            node_cpu: arm64
            archive_ext: tar.gz
            binary_ext: ""
          - target: x86_64-pc-windows-msvc
            node_os: win32
            node_cpu: x64
            archive_ext: zip
            binary_ext: ".exe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@edmondfrank"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: artifacts

      - name: Extract binary and publish
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Find the archive
          ARCHIVE=$(find artifacts -name "*.${{ matrix.archive_ext }}" | head -1)
          echo "Found archive: $ARCHIVE"

          # Create package directory
          PKG_DIR="npm-release/${{ matrix.target }}"
          mkdir -p "$PKG_DIR"

          # Extract binary
          BIN_NAME="probe${{ matrix.binary_ext }}"
          if [[ "${{ matrix.archive_ext }}" == "tar.gz" ]]; then
            tar -tzf "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$PKG_DIR" --strip-components=1 "$(tar -tzf "$ARCHIVE" | grep "/$BIN_NAME$")"
          elif [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            # List archive contents for debugging
            unzip -Z1 "$ARCHIVE"
            # Find the binary path inside the archive (normalize backslashes to forward slashes)
            FILE_PATH=$(unzip -Z1 "$ARCHIVE" | grep -i "$BIN_NAME$" | head -1 | tr '\\' '/')
            if [ -z "$FILE_PATH" ]; then
              echo "ERROR: Could not find $BIN_NAME in archive"
              exit 1
            fi
            echo "Extracting: $FILE_PATH"
            unzip -j "$ARCHIVE" "$FILE_PATH" -d "$PKG_DIR"
          fi

          # Copy documentation
          cp README.md "$PKG_DIR/" || true
          cp LICENSE "$PKG_DIR/" || true

          # Determine version
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # Generate package.json from template
          export node_pkg="@edmondfrank/probe-${{ matrix.node_os }}-${{ matrix.node_cpu }}"
          export version="${VERSION#v}"
          export node_os="${{ matrix.node_os }}"
          export node_arch="${{ matrix.node_cpu }}"
          envsubst < npm-release/package.json.tmpl > "$PKG_DIR/package.json"

          # Publish (use --tag for prerelease versions as npm requires)
          cd "$PKG_DIR"
          npm publish --access public --provenance --tag latest

  # Publish meta npm package (after all target packages)
  publish-meta-package:
    name: Publish Meta NPM Package
    needs: publish-target-packages
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@edmondfrank"

      - name: Generate meta-package package.json
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          fi
          export version="${VERSION#v}"
          envsubst < package.json > package.json.out
          mv package.json.out package.json

      - name: Publish meta-package
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --provenance --tag latest
